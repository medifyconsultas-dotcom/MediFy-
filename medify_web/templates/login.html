{% extends 'base.html' %}
{% load static %}
{% block title %}Login{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Cadastro</title>
  <style>
    body {font-family: Arial; background:#f0f0f0; display:flex; justify-content:center; align-items:center; height:100vh;}
    form {background:white; padding:20px; border-radius:8px; width:300px;}
    select, input, button {width:100%; margin-bottom:10px; padding:8px;}
    footer {text-align:center; margin-top:10px; font-size:12px;}
  </style>
</head>
<body>
  <form method="POST">
    {% csrf_token %}
    <h2>Entrar</h2>
    <label>Perfil:</label>
    <select name="perfil">
      <option value="paciente">Paciente</option>
      <option value="profissional">Profissional</option>
      <option value="clinica">Clínica</option>
    </select>
    <input type="email" name="email" placeholder="Email">
    <input type="password" name="senha" placeholder="Senha">
    <button type="submit">Entrar</button>
    <a href="{% url 'medify_web:cadastrar' %}">Criar Conta</a> |
    <a href="#">Esqueci a senha</a>
    {% if erro %}
      <p style="color:red;">{{ erro }}</p>
    {% endif %}
    <footer>
      <a href="#">Download Mobile (iOS/Android)</a><br>
      <a href="#">Download Desktop (Windows/Mac)</a>
    </footer>
  </form>
</body>
</html>
{% endblock %}
