{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha</title>
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
  <main style="max-width:560px; margin:2rem auto;">
    <a href="{% url 'medify_web:auth' %}" class="btn btn-outline">&larr; Voltar</a>
    <h1>Esqueci minha senha</h1>

    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="message {{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    <form method="post" action="{% url 'medify_web:esqueci_senha' %}" style="background:#fff; padding:1rem; border-radius:6px;">
      {% csrf_token %}
      <label>
        Informe seu e-mail cadastrado<br>
        <input type="email" name="email" required placeholder="seu@email.com">
      </label>
      <div style="margin-top:1rem;">
        <button class="btn btn-primary" type="submit">Enviar e-mail de redefinição</button>
      </div>
    </form>

  </main>
</body>
</html>
