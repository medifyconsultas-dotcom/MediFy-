{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClinicApp - Login</title>
  <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Garantir que o botão de mostrar senha apareça */
    .password-wrapper {
      position: relative !important;
      margin-bottom: 20px !important;
    }
    
    .password-wrapper input {
      margin-bottom: 0 !important;
      padding-right: 45px !important;
    }
    
    .toggle-password {
      position: absolute !important;
      right: 15px !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      background: transparent !important;
      border: none !important;
      cursor: pointer !important;
      padding: 8px !important;
      color: #666 !important;
      font-size: 18px !important;
      z-index: 10 !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 35px !important;
      height: 35px !important;
      margin: 0 !important;
    }
    
    .toggle-password:hover {
      color: #2196F3 !important;
    }
    
    .toggle-password i {
      pointer-events: none !important;
      font-size: 18px !important;
    }
  </style>
</head>
<body class="hero-gradient">
  <div class="auth-container">
    
    <!-- Header -->
    <div class="auth-header">
      <div class="logo medical-gradient">
        <img src="{% static 'imagens/estetoscopio.png' %}" alt="MediFy Logo" style="width:40px;height:40px;object-fit:contain;filter:brightness(0) invert(1);">
</div>

      <h1>MediFy</h1>
      <p>Sistema de Gestão Médica</p>
    </div>

    <!-- Feedback -->
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% if erro %}
      <div class="message error">{{ erro }}</div>
    {% endif %}

    <!-- Card -->
    <div class="auth-card medical-shadow">
      <div class="tabs">
        <button id="tab-login" class="tab active">Entrar</button>
        <button id="tab-register" class="tab">Cadastrar</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form active" action="{% url 'medify_web:auth' %}" method="post">
        {% csrf_token %}
        <label>Email</label>
        <input type="email" name="email" placeholder="seu@email.com" required />

        <label>Senha</label>
        <div class="password-wrapper">
          <input type="password" id="senha-login" name="senha" placeholder="••••••••" required />
          <button type="button" class="toggle-password" onclick="togglePassword('senha-login', 'eye-login')" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; padding: 8px; color: #666; font-size: 18px; z-index: 10; display: inline-flex; align-items: center; justify-content: center; width: 35px; height: 35px; margin: 0;">
            <i class="fas fa-eye" id="eye-login" style="font-size: 18px;"></i>
          </button>
        </div>

        <input type="hidden" name="perfil" value="paciente" />
        <button type="submit" class="btn medical-gradient">Entrar</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form" action="{% url 'medify_web:cadastrar' %}" method="post">
        {% csrf_token %}
        <div id="cadastro-etapa-1">
          <label>Nome Completo</label>
          <input type="text" name="nome" placeholder="Seu nome" required />

          <label>Email</label>
          <input type="email" name="email" placeholder="seu@email.com" required />

          <label>Senha</label>
          <div class="password-wrapper">
            <input type="password" id="senha-cadastro" name="senha" placeholder="••••••••" required />
            <button type="button" class="toggle-password" onclick="togglePassword('senha-cadastro', 'eye-cadastro')" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; padding: 8px; color: #666; font-size: 18px; z-index: 10; display: inline-flex; align-items: center; justify-content: center; width: 35px; height: 35px; margin: 0;">
              <i class="fas fa-eye" id="eye-cadastro" style="font-size: 18px;"></i>
            </button>
          </div>

          <label>Confirmar Senha</label>
          <div class="password-wrapper">
            <input type="password" id="confirmar-senha-cadastro" name="confirmar_senha" placeholder="••••••••" required />
            <button type="button" class="toggle-password" onclick="togglePassword('confirmar-senha-cadastro', 'eye-confirmar')" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; padding: 8px; color: #666; font-size: 18px; z-index: 10; display: inline-flex; align-items: center; justify-content: center; width: 35px; height: 35px; margin: 0;">
              <i class="fas fa-eye" id="eye-confirmar" style="font-size: 18px;"></i>
            </button>
          </div>

          <label>Tipo de conta</label>
<div class="profiles">
  <button type="button" class="profile-btn active" data-profile="paciente">
    <div class="profile-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
      </svg>
    </div>
    <span>Paciente</span>
    <div class="selection-indicator"></div>
  </button>
  
  <button type="button" class="profile-btn" data-profile="profissional">
    <div class="profile-icon">
      <svg viewBox="0 0 24 24">
        <path d="M10 16v-1H3.01L3 19c0 1.11.89 2 2 2h14c1.11 0 2-.89 2-2v-4h-7v1h-4zm10-9h-4.01V5l-2-2h-4l-2 2v2H4c-1.1 0-2 .9-2 2v3c0 1.11.89 2 2 2h6v-2h4v2h6c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-6 0h-4V5h4v2z"/>
      </svg>
    </div>
    <span>Profissional</span>
    <div class="selection-indicator"></div>
  </button>
  
  <button type="button" class="profile-btn" data-profile="clinica">
    <div class="profile-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12,3L2,12H5V20H19V12H22L12,3M12,5.7L18,11.2V18H13V14H11V18H6V11.2L12,5.7M15,15H17V16H15V15Z"/>
      </svg>
    </div>
    <span>Clínica</span>
    <div class="selection-indicator"></div>
  </button>
</div>
          <input type="hidden" name="perfil" id="perfil-input" value="paciente" required />
          <button type="button" id="btn-avancar" class="btn secondary-gradient" style="margin-top:1rem">Avançar</button>
        </div>

        <div id="cadastro-etapa-2" style="display:none">
          <!-- Paciente -->
          <div id="campos-paciente" class="campos-extras" style="display:none">
            <label>Data de Nascimento</label>
            <input type="date" name="data_nascimento" />
            <label>Telefone</label>
            <input type="text" name="telefone" />
            <label>CPF</label>
            <input type="text" name="cpf" />
            <label>Endereço</label>
            <input type="text" name="endereco" />
            <label>Plano</label>
            <input type="text" name="plano" />
          </div>
          <!-- Profissional -->
          <div id="campos-profissional" class="campos-extras" style="display:none">
            <label>Especialidade</label>
            <input type="text" name="especialidade" id="especialidade-input" 
                   placeholder="Ex: Cardiologia, Pediatria, Ortopedia..."
                   list="especialidades-list" />
            <datalist id="especialidades-list">
              <option value="Cardiologia">
              <option value="Dermatologia">
              <option value="Pediatria">
              <option value="Ortopedia">
              <option value="Ginecologia">
              <option value="Neurologia">
              <option value="Oftalmologia">
              <option value="Clínica Geral">
            </datalist>
            <label>CRM</label>
            <input type="text" name="crm" />
            <label>CPF/CNPJ</label>
            <input type="text" name="cpf_cnpj" />
            <label>Telefone</label>
            <input type="text" name="telefone" />
            <label>Endereço</label>
            <input type="text" name="endereco" placeholder="Ex: Rua, número, bairro, cidade - UF" />
          </div>
          <!-- Clínica -->
          <div id="campos-clinica" class="campos-extras" style="display:none">
  <!-- Campos básicos em grid -->
  <div class="clinica-basicos" style="border-top:none;">
    <div>
      <label>CNPJ</label>
      <input type="text" name="cnpj" required />
    </div>
    <div>
      <label>Nome da Clínica</label>
      <input type="text" name="nome_fantasia" required />
    </div>
    <div>
      <label>Endereço</label>
      <input type="text" name="endereco" required />
    </div>
    <div>
      <label>Telefone</label>
      <input type="text" name="telefone" required />
    </div>
  </div>

  <!-- Quantidades em linha -->
  <!-- (Campos de médicos e recepcionistas removidos conforme solicitado) -->
</div>
          <button type="button" id="btn-voltar" class="btn btn-outline" style="margin-right:1rem">Voltar</button>
          <button type="submit" class="btn secondary-gradient">Finalizar Cadastro</button>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="auth-footer">
      <p>Sistema seguro e confiável para gestão médica</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Alternar abas
      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const formLogin = document.getElementById("login-form");
      const formRegister = document.getElementById("register-form");

      tabLogin.addEventListener("click", () => {
        tabLogin.classList.add("active");
        tabRegister.classList.remove("active");
        formLogin.classList.add("active");
        formRegister.classList.remove("active");
      });

      tabRegister.addEventListener("click", () => {
        tabRegister.classList.add("active");
        tabLogin.classList.remove("active");
        formRegister.classList.add("active");
        formLogin.classList.remove("active");
      });

      // Gerenciar etapas do cadastro
      const perfilInput = document.getElementById('perfil-input');
      const profileBtns = document.querySelectorAll('.profile-btn');
      const etapa1 = document.getElementById('cadastro-etapa-1');
      const etapa2 = document.getElementById('cadastro-etapa-2');
      const btnAvancar = document.getElementById('btn-avancar');
      const btnVoltar = document.getElementById('btn-voltar');
      const camposPaciente = document.getElementById('campos-paciente');
      const camposProfissional = document.getElementById('campos-profissional');
      const camposClinica = document.getElementById('campos-clinica');

      function mostrarCamposExtras() {
        if (camposPaciente) camposPaciente.style.display = perfilInput && perfilInput.value === 'paciente' ? '' : 'none';
        if (camposProfissional) camposProfissional.style.display = perfilInput && perfilInput.value === 'profissional' ? '' : 'none';
        if (camposClinica) camposClinica.style.display = perfilInput && perfilInput.value === 'clinica' ? '' : 'none';
      }

      // Função para atualizar required só nos campos visíveis
      function atualizarRequiredCamposVisiveis() {
        // Remove required de todos os campos extras
        document.querySelectorAll('.campos-extras input').forEach(input => {
          input.removeAttribute('required');
        });
        // Adiciona required apenas nos campos visíveis
        document.querySelectorAll('.campos-extras').forEach(div => {
          if (div.style.display !== 'none') {
            div.querySelectorAll('input').forEach(input => {
              input.setAttribute('required', 'required');
            });
          }
        });
      }

      // Event listeners para as etapas do cadastro
      if (btnAvancar) {
        btnAvancar.addEventListener('click', function() {
          if (etapa1) etapa1.style.display = 'none';
          if (etapa2) etapa2.style.display = '';
          mostrarCamposExtras();
          atualizarRequiredCamposVisiveis();
        });
      }

      if (btnVoltar) {
        btnVoltar.addEventListener('click', function() {
          if (etapa2) etapa2.style.display = 'none';
          if (etapa1) etapa1.style.display = '';
          atualizarRequiredCamposVisiveis();
        });
      }

      // Selecionar perfil
      if (profileBtns.length > 0 && perfilInput) {
      profileBtns.forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          profileBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
            if (perfilInput) perfilInput.value = btn.getAttribute('data-profile');
            mostrarCamposExtras();
            atualizarRequiredCamposVisiveis();
          });
        });
      }

      // Correção automática de especialidade
      const especialidadeInput = document.getElementById('especialidade-input');
      if (especialidadeInput) {
        especialidadeInput.addEventListener('blur', function() {
          const valor = this.value.trim();
          if (valor) {
            // Lista de especialidades padronizadas e mapeamentos
            const especialidades = {
              'cardiologista': 'Cardiologia', 'cardio': 'Cardiologia',
              'dermatologista': 'Dermatologia', 'dermatol': 'Dermatologia',
              'endocrinologista': 'Endocrinologia', 'endocrino': 'Endocrinologia',
              'gastroenterologista': 'Gastroenterologia', 'gastro': 'Gastroenterologia',
              'ginecologista': 'Ginecologia', 'gineco': 'Ginecologia',
              'neurologista': 'Neurologia', 'neuro': 'Neurologia',
              'oftalmologista': 'Oftalmologia', 'oftalmo': 'Oftalmologia',
              'ortopedista': 'Ortopedia', 'ortopedia': 'Ortopedia',
              'otorrinolaringologista': 'Otorrinolaringologia', 'otorrino': 'Otorrinolaringologia',
              'pediatra': 'Pediatria', 'pediatria': 'Pediatria',
              'psiquiatra': 'Psiquiatria', 'psiquiatria': 'Psiquiatria',
              'urologista': 'Urologia', 'urologia': 'Urologia',
              'clinica geral': 'Clínica Geral', 'clinico geral': 'Clínica Geral', 'geral': 'Clínica Geral',
              'cirurgia': 'Cirurgia Geral', 'cirurgiao': 'Cirurgia Geral',
              'oncologista': 'Oncologia', 'oncologia': 'Oncologia',
              'geriatra': 'Geriatria', 'geriatria': 'Geriatria',
              'reumatologista': 'Reumatologia', 'reumatologia': 'Reumatologia',
              'pneumologista': 'Pneumologia', 'pneumologia': 'Pneumologia',
              'infectologista': 'Infectologia', 'infectologia': 'Infectologia',
              'nefrologista': 'Nefrologia', 'nefrologia': 'Nefrologia',
              'alergologista': 'Alergologia', 'alergologia': 'Alergologia',
              'hematologista': 'Hematologia', 'hematologia': 'Hematologia'
            };
            
            const valorLower = valor.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            let corrigida = null;
            
            // Verifica mapeamento direto
            if (especialidades[valorLower]) {
              corrigida = especialidades[valorLower];
            } else {
              // Verifica correspondência exata (case-insensitive)
              const padronizadas = ['Cardiologia', 'Dermatologia', 'Endocrinologia', 'Gastroenterologia', 
                                   'Ginecologia', 'Neurologia', 'Oftalmologia', 'Ortopedia', 
                                   'Otorrinolaringologia', 'Pediatria', 'Psiquiatria', 'Urologia', 
                                   'Clínica Geral', 'Cirurgia Geral', 'Oncologia', 'Geriatria', 
                                   'Reumatologia', 'Pneumologia', 'Infectologia', 'Nefrologia', 
                                   'Alergologia', 'Hematologia'];
              for (const esp of padronizadas) {
                if (esp.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '') === valorLower) {
                  corrigida = esp;
                  break;
                }
              }
            }
            
            if (corrigida && corrigida !== valor) {
              this.value = corrigida;
              // Mostrar mensagem de correção (opcional)
              const msg = document.createElement('div');
              msg.style.cssText = 'margin-top: 0.5rem; padding: 0.5rem; background: #e3f2fd; color: #1976d2; border-radius: 4px; font-size: 0.875rem;';
              msg.textContent = 'Especialidade corrigida para: ' + corrigida;
              this.parentNode.insertBefore(msg, this.nextSibling);
              setTimeout(() => msg.remove(), 3000);
            }
          }
        });
      }

      // ===== FORMATAÇÃO AUTOMÁTICA DE CAMPOS =====
      
      // Função para formatar telefone: (XX) XXXXX-XXXX ou (XX) XXXX-XXXX
      function formatarTelefone(input) {
        let valor = input.value.replace(/\D/g, '');
        if (valor.length <= 10) {
          // Telefone fixo: (XX) XXXX-XXXX
          valor = valor.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, '($1) $2-$3');
        } else {
          // Celular: (XX) XXXXX-XXXX
          valor = valor.replace(/^(\d{2})(\d{5})(\d{0,4}).*/, '($1) $2-$3');
        }
        input.value = valor;
      }

      // Função para formatar CPF: XXX.XXX.XXX-XX
      function formatarCPF(input) {
        let valor = input.value.replace(/\D/g, '');
        if (valor.length <= 11) {
          valor = valor.replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2}).*/, '$1.$2.$3-$4');
        }
        input.value = valor;
      }

      // Função para formatar CNPJ: XX.XXX.XXX/XXXX-XX
      function formatarCNPJ(input) {
        let valor = input.value.replace(/\D/g, '');
        if (valor.length <= 14) {
          valor = valor.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/, '$1.$2.$3/$4-$5');
        }
        input.value = valor;
      }

      // Função para formatar CPF ou CNPJ (campo combinado)
      function formatarCPFCNPJ(input) {
        let valor = input.value.replace(/\D/g, '');
        if (valor.length <= 11) {
          // CPF: XXX.XXX.XXX-XX
          valor = valor.replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2}).*/, '$1.$2.$3-$4');
        } else {
          // CNPJ: XX.XXX.XXX/XXXX-XX
          valor = valor.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{0,2}).*/, '$1.$2.$3/$4-$5');
        }
        input.value = valor;
      }

      // Função para formatar CRM: números com ou sem hífen (formato flexível)
      function formatarCRM(input) {
        let valor = input.value.replace(/\D/g, '');
        // CRM geralmente tem 4-6 dígitos, alguns estados usam hífen
        // Formato: XXXXX ou XXXXX-XX
        if (valor.length <= 5) {
          input.value = valor;
        } else {
          valor = valor.replace(/^(\d{5})(\d{0,2}).*/, '$1-$2');
          input.value = valor;
        }
      }

      // Objeto para rastrear quais campos já tiveram formatação aplicada
      const camposFormatados = new Set();

      // Aplicar formatação aos campos quando a página carregar e quando os campos aparecerem
      function aplicarFormatacao() {
        // Telefone - Paciente
        const telefonePaciente = document.querySelector('#campos-paciente input[name="telefone"]');
        if (telefonePaciente && !camposFormatados.has('telefone-paciente')) {
          camposFormatados.add('telefone-paciente');
          telefonePaciente.addEventListener('input', function() {
            formatarTelefone(this);
          });
          telefonePaciente.setAttribute('maxlength', '15');
        }

        // CPF - Paciente
        const cpfPaciente = document.querySelector('#campos-paciente input[name="cpf"]');
        if (cpfPaciente && !camposFormatados.has('cpf-paciente')) {
          camposFormatados.add('cpf-paciente');
          cpfPaciente.addEventListener('input', function() {
            formatarCPF(this);
          });
          cpfPaciente.setAttribute('maxlength', '14');
        }

        // Telefone - Profissional
        const telefoneProfissional = document.querySelector('#campos-profissional input[name="telefone"]');
        if (telefoneProfissional && !camposFormatados.has('telefone-profissional')) {
          camposFormatados.add('telefone-profissional');
          telefoneProfissional.addEventListener('input', function() {
            formatarTelefone(this);
          });
          telefoneProfissional.setAttribute('maxlength', '15');
        }

        // CPF/CNPJ - Profissional
        const cpfCnpjProfissional = document.querySelector('#campos-profissional input[name="cpf_cnpj"]');
        if (cpfCnpjProfissional && !camposFormatados.has('cpf-cnpj-profissional')) {
          camposFormatados.add('cpf-cnpj-profissional');
          cpfCnpjProfissional.addEventListener('input', function() {
            formatarCPFCNPJ(this);
          });
          cpfCnpjProfissional.setAttribute('maxlength', '18');
        }

        // CRM - Profissional
        const crmProfissional = document.querySelector('#campos-profissional input[name="crm"]');
        if (crmProfissional && !camposFormatados.has('crm-profissional')) {
          camposFormatados.add('crm-profissional');
          crmProfissional.addEventListener('input', function() {
            formatarCRM(this);
          });
          crmProfissional.setAttribute('maxlength', '8');
        }

        // CNPJ - Clínica
        const cnpjClinica = document.querySelector('#campos-clinica input[name="cnpj"]');
        if (cnpjClinica && !camposFormatados.has('cnpj-clinica')) {
          camposFormatados.add('cnpj-clinica');
          cnpjClinica.addEventListener('input', function() {
            formatarCNPJ(this);
          });
          cnpjClinica.setAttribute('maxlength', '18');
        }

        // Telefone - Clínica
        const telefoneClinica = document.querySelector('#campos-clinica input[name="telefone"]');
        if (telefoneClinica && !camposFormatados.has('telefone-clinica')) {
          camposFormatados.add('telefone-clinica');
          telefoneClinica.addEventListener('input', function() {
            formatarTelefone(this);
          });
          telefoneClinica.setAttribute('maxlength', '15');
        }
      }

      // Aplicar formatação quando a página carregar
      aplicarFormatacao();

      // Reaplicar formatação quando os campos aparecerem (ao avançar para etapa 2)
      // Reutilizando a variável btnAvancar já declarada acima
      if (btnAvancar) {
        btnAvancar.addEventListener('click', function() {
          setTimeout(aplicarFormatacao, 100);
        });
      }

      // Reaplicar quando o perfil mudar
      // Reutilizando a variável profileBtns já declarada acima
      if (profileBtns && profileBtns.length > 0) {
        profileBtns.forEach(btn => {
          btn.addEventListener('click', function() {
            setTimeout(aplicarFormatacao, 100);
          });
        });
      }
    });

    // Função para alternar entre mostrar e ocultar senha
    function togglePassword(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      
      if (input && eye) {
        if (input.type === 'password') {
          input.type = 'text';
          eye.classList.remove('fa-eye');
          eye.classList.add('fa-eye-slash');
        } else {
          input.type = 'password';
          eye.classList.remove('fa-eye-slash');
          eye.classList.add('fa-eye');
        }
      }
    }
  </script>

  <script>
